name: Golden files

# Converts real DICOM samples, downloaded from the NCI Imaging Data Commons at run time (they are
# not stored in the repository; see src/test/resources/golden/README.md). Weekly and on demand
# rather than on every push, so an outage there doesn't fail ordinary builds.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test with the golden samples
        run: mvn -B test -Pgolden
